<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in - CilamAI</title>
  <link rel="icon" type="image/x-icon" href="./favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d0d0d;
      --surface: #171717;
      --surface-2: #2f2f2f;
      --border: #2d2d2d;
      --text: #ececec;
      --text-dim: #8a8a8a;
      --accent: #f0f0f0;
      --accent-text: #111111;
      --hover: #2a2a2a;
      --radius: 12px;
    }

    html[data-theme='light'] {
      --bg: #f7f7f7;
      --surface: #e4e4e4;
      --surface-2: #d5d5d5;
      --border: #d9d9d9;
      --text: #1a1a1a;
      --text-dim: #6b6b6b;
      --accent: #1a1a1a;
      --accent-text: #ffffff;
      --hover: #d8d8d8;
    }

    html[data-theme='blue'] { --bg: #0d1524; --surface: #16233c; --surface-2: #223252; --border: #2a3d61; --text: #e8edf7; --text-dim: #8fa3c4; --accent: #4d9fff; --accent-text: #ffffff; --hover: #2e4570; }
    html[data-theme='red'] { --bg: #1c0d0d; --surface: #331616; --surface-2: #4a2020; --border: #5c2b2b; --text: #f7e8e8; --text-dim: #c48f8f; --accent: #ff5a5a; --accent-text: #ffffff; --hover: #5c2626; }
    html[data-theme='yellow'] { --bg: #171407; --surface: #2b250e; --surface-2: #3f3618; --border: #52471f; --text: #f7f0d8; --text-dim: #c4b48a; --accent: #f5c518; --accent-text: #1a1400; --hover: #453a1a; }
    html[data-theme='green'] { --bg: #0c1710; --surface: #12261a; --surface-2: #1a3524; --border: #24402c; --text: #e6f5ea; --text-dim: #93b8a0; --accent: #3ddc84; --accent-text: #0a120c; --hover: #1e422b; }
    html[data-theme='black'] { --bg: #000000; --surface: #0d0d0d; --surface-2: #1a1a1a; --border: #262626; --text: #f2f2f2; --text-dim: #7a7a7a; --accent: #f0f0f0; --accent-text: #000000; --hover: #242424; }
    html[data-theme='github-dark'] { --bg: #0d1117; --surface: #151b23; --surface-2: #212830; --border: #3d444d; --text: #f0f6fc; --text-dim: #9198a1; --accent: #1f6feb; --accent-text: #ffffff; --hover: #212830; }
    html[data-theme='github-light'] { --bg: #ffffff; --surface: #ffffff; --surface-2: #eaeef2; --border: #d0d7de; --text: #1f2328; --text-dim: #59636e; --accent: #0969da; --accent-text: #ffffff; --hover: #e7ecf2; }
    html[data-theme='fox'] { --bg: #2b1a16; --surface: #3c231c; --surface-2: #4e2f25; --border: #5c3a2e; --text: #f5e4dc; --text-dim: #c7a294; --accent: #e0632f; --accent-text: #ffffff; --hover: #4a2b21; }
    html[data-theme='ic-orange-ppl'] { --bg: #1c130a; --surface: #2a1d10; --surface-2: #3d2a17; --border: #4a3520; --text: #f2e7d5; --text-dim: #b39a78; --accent: #ff8700; --accent-text: #1c130a; --hover: #372715; }
    html[data-theme='monochrome'] { --bg: #141419; --surface: #1e1e26; --surface-2: #2a2a34; --border: #34343e; --text: #e9e9ee; --text-dim: #8f8f9c; --accent: #dfdfe6; --accent-text: #141419; --hover: #26262f; }
    html[data-theme='noctis'] { --bg: #052733; --surface: #093645; --surface-2: #0f4558; --border: #155066; --text: #d8eff6; --text-dim: #7fb2c6; --accent: #4990a5; --accent-text: #ffffff; --hover: #0d4254; }
    html[data-theme='notionish'] { --bg: #1c1c1c; --surface: #262626; --surface-2: #333333; --border: #3a3a3a; --text: #f1f1f1; --text-dim: #9b9b9b; --accent: #e3e3e3; --accent-text: #1c1c1c; --hover: #2e2e2e; }
    html[data-theme='polychrome'] { --bg: #2a2438; --surface: #342c46; --surface-2: #43395c; --border: #4f4468; --text: #efeaf7; --text-dim: #a79cc0; --accent: #f2a65a; --accent-text: #241f31; --hover: #3d3454; }
    html[data-theme='selene'] { --bg: #122225; --surface: #1a2e32; --surface-2: #244045; --border: #2c4d53; --text: #e6e3db; --text-dim: #93aaa8; --accent: #55b6a6; --accent-text: #102226; --hover: #20383d; }
    html[data-theme='tokyo-night'] { --bg: #1a1b26; --surface: #24283b; --surface-2: #2f334d; --border: #3b4261; --text: #c0caf5; --text-dim: #787fa0; --accent: #7aa2f7; --accent-text: #16161e; --hover: #292e42; }
    html[data-theme='opencode'] { --bg: #141414; --surface: #1c1c1c; --surface-2: #262626; --border: #2e2e2e; --text: #e8e8e8; --text-dim: #9a9a9a; --accent: #f2874a; --accent-text: #17110b; --hover: #1f1f1f; }
    html[data-theme='opencode-light'] { --bg: #f9f8f5; --surface: #ffffff; --surface-2: #f1efea; --border: #dcd9d1; --text: #1f1e1c; --text-dim: #6b6862; --accent: #c2410c; --accent-text: #ffffff; --hover: #eae7e1; }
    html[data-theme='vercel-dark'] { --bg: #000000; --surface: #111111; --surface-2: #1a1a1a; --border: #333333; --text: #ededed; --text-dim: #888888; --accent: #ffffff; --accent-text: #000000; --hover: #1f1f1f; }
    html[data-theme='vercel-light'] { --bg: #ffffff; --surface: #ffffff; --surface-2: #f2f2f2; --border: #eaeaea; --text: #000000; --text-dim: #666666; --accent: #000000; --accent-text: #ffffff; --hover: #f2f2f2; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* Electron custom frameless titlebar */
    .titlebar {
      height: 36px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
      -webkit-app-region: drag;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: transparent;
    }

    .titlebar-left {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-left: 14px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-dim);
      opacity: 0.8;
    }

    .titlebar-right {
      display: flex;
      align-items: center;
      height: 100%;
      -webkit-app-region: no-drag;
    }

    .close-btn {
      width: 44px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .close-btn:hover {
      background: var(--hover);
      color: var(--text);
    }

    /* Main container layout */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 36px 24px 28px;
      width: 100%;
      max-width: 360px;
      margin: 0 auto;
    }

    .auth-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.4s ease-out both;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    /* Button: Continue with Github */
    .btn-github {
      width: 100%;
      height: 52px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 15px;
      font-weight: 500;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: background 0.2s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s ease;
      outline: none;
    }

    .btn-github:hover {
      background: var(--hover);
    }

    .btn-github:active {
      transform: translateY(0);
    }

    .btn-github svg {
      flex-shrink: 0;
    }

    /* Button: Continue with Google */
    .btn-google {
      width: 100%;
      height: 52px;
      margin-bottom: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 15px;
      font-weight: 500;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: background 0.2s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s ease;
      outline: none;
    }

    .btn-google:hover {
      background: var(--hover);
    }

    .btn-google:active {
      transform: translateY(0);
    }

    .btn-google svg {
      flex-shrink: 0;
    }

    /* Sign-in error message */
    .signin-error {
      margin-top: 18px;
      padding: 10px 14px;
      border-radius: var(--radius);
      background: rgba(229, 72, 77, 0.12);
      border: 1px solid rgba(229, 72, 77, 0.35);
      color: #e5484d;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
      word-break: break-word;
    }

    /* Divider: OR */
    .divider {
      display: flex;
      align-items: center;
      width: 100%;
      margin: 22px 0;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .divider span {
      padding: 0 14px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* Button: Continue with Email */
    .btn-email {
      width: 100%;
      height: 52px;
      background: var(--accent);
      border: 1px solid transparent;
      border-radius: var(--radius);
      color: var(--accent-text);
      font-size: 15px;
      font-weight: 500;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      outline: none;
    }

    .btn-email:hover {
      background: color-mix(in srgb, var(--accent) 88%, #000);
    }

    .btn-email:active {
      transform: translateY(0);
    }

    /* Footer / Bottom text */
    .footer-text {
      margin-top: 38px;
      font-size: 14px;
      color: var(--text);
      text-align: center;
      line-height: 1.4;
    }

    .login-link {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1.5px dotted var(--accent);
      padding-bottom: 1px;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    .login-link:hover {
      opacity: 0.8;
    }

    /* Waiting panel for browser sign-in */
    .waiting {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 16px;
      animation: fadeIn 0.3s ease-out both;
    }

    .waiting.active {
      display: flex;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .waiting-text {
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      margin-top: 4px;
    }

    .waiting-subtext {
      font-size: 13px;
      color: var(--text-dim);
    }

    .btn-cancel {
      margin-top: 12px;
      padding: 10px 20px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .btn-cancel:hover {
      background: var(--hover);
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="titlebar">
    <div class="titlebar-left">
      <img src="./favicon.ico" width="14" height="14" alt="" />
      <span>CilamAI</span>
    </div>
    <div class="titlebar-right">
      <button class="close-btn" id="close-btn" title="Close">
        <svg width="10" height="10" viewBox="0 0 10 10" stroke="currentColor" stroke-width="1.2">
          <line x1="0" y1="0" x2="10" y2="10" />
          <line x1="10" y1="0" x2="0" y2="10" />
        </svg>
      </button>
    </div>
  </div>

  <div class="content" id="signin-panel">
    <div class="auth-container">
      <div class="btn-group">
        <!-- Continue with Google -->
        <button type="button" class="btn-google" id="google-btn">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          <span>Continue with Google</span>
        </button>

        <!-- Continue with Github -->
        <button type="button" class="btn-github" id="github-btn">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
          </svg>
          <span>Continue with Github</span>
        </button>

        <!-- Divider -->
        <div class="divider">
          <span>OR</span>
        </div>

        <!-- Continue with Email -->
        <button type="button" class="btn-email" id="email-btn">
          <span>Continue with Email</span>
        </button>
      </div>

      <!-- Sign-in error -->
      <div class="signin-error" id="signin-error" hidden></div>

      <!-- Footer -->
      <div class="footer-text">
        Already have an account? <a href="#" class="login-link" id="login-link">Log in</a>
      </div>
    </div>
  </div>

  <div class="content waiting" id="waiting-panel">
    <p class="waiting-text">Continue signing in with your browser</p>
    <p class="waiting-subtext">Complete authentication in the opened window</p>
    <button type="button" class="btn-cancel" id="cancel-signin-btn">Cancel</button>
  </div>

  <script type="module">
    const MAIN_APP = './index.html'

    function goToApp() {
      window.location.href = MAIN_APP
    }

    const signinErrorEl = document.getElementById('signin-error')
    const showSigninError = (msg) => {
      if (!signinErrorEl) return
      signinErrorEl.textContent = msg || 'Sign-in failed. Please try again.'
      signinErrorEl.hidden = false
    }

    async function waitForElectron(timeout = 4000) {
      const start = Date.now()
      while (!window.electron && Date.now() - start < timeout) {
        await new Promise(r => setTimeout(r, 50))
      }
      return !!window.electron
    }

    const applyTheme = (theme) => {
      const resolved = theme === 'system'
        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : theme
      document.documentElement.dataset.theme = resolved
    }

    const electronReady = await waitForElectron()

    if (electronReady) {
      window.electron?.onThemeChange?.(applyTheme)
      window.electron?.getTheme?.().then((res) => {
        if (res?.theme) applyTheme(res.theme)
      })
    } else {
      applyTheme(window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    }

    async function checkExistingUser() {
      try {
        const user = await window.electron?.getUser?.()
        if (user && (user.name || user.email)) {
          localStorage.setItem('cilamai-user', JSON.stringify(user))
          return true
        }
      } catch {}
      return false
    }

    if (electronReady && await checkExistingUser()) {
      goToApp()
    } else {
      const signinPanel = document.getElementById('signin-panel')
      const waitingPanel = document.getElementById('waiting-panel')

      document.querySelector('#close-btn')?.addEventListener('click', () => {
        window.electron?.closeWindow?.() || window.close()
      })

      document.querySelector('#login-link')?.addEventListener('click', (e) => {
        e.preventDefault()
        document.querySelector('#github-btn')?.click()
      })

      // Continue with Email (Google / Email OAuth)
      document.querySelector('#email-btn')?.addEventListener('click', async () => {
        if (window.electron?.signIn) {
          signinPanel.style.display = 'none'
          waitingPanel.classList.add('active')
          const result = await window.electron.signIn('google')
          if (result?.ok && result.user) {
            localStorage.setItem('cilamai-user', JSON.stringify(result.user))
            window.electron?.setUser?.(result.user)
            goToApp()
          } else {
            waitingPanel.classList.remove('active')
            signinPanel.style.display = ''
            showSigninError(result?.error)
          }
        }
      })

      // Continue with Google
      document.querySelector('#google-btn')?.addEventListener('click', async () => {
        if (window.electron?.signIn) {
          signinPanel.style.display = 'none'
          waitingPanel.classList.add('active')
          const result = await window.electron.signIn('google')
          if (result?.ok && result.user) {
            localStorage.setItem('cilamai-user', JSON.stringify(result.user))
            window.electron?.setUser?.(result.user)
            goToApp()
          } else {
            waitingPanel.classList.remove('active')
            signinPanel.style.display = ''
            showSigninError(result?.error)
          }
        }
      })

      // Continue with Github
      document.querySelector('#github-btn')?.addEventListener('click', async () => {
        if (window.electron?.signIn) {
          signinPanel.style.display = 'none'
          waitingPanel.classList.add('active')
          const result = await window.electron.signIn('github')
          if (result?.ok && result.user) {
            localStorage.setItem('cilamai-user', JSON.stringify(result.user))
            window.electron?.setUser?.(result.user)
            goToApp()
          } else {
            waitingPanel.classList.remove('active')
            signinPanel.style.display = ''
            showSigninError(result?.error)
          }
        }
      })

      document.querySelector('#cancel-signin-btn')?.addEventListener('click', () => {
        waitingPanel.classList.remove('active')
        signinPanel.style.display = ''
      })
    }
  </script>
</body>
</html>
